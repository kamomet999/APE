<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<title>APE — ノンタイトル ピッチ</title>
<style>
  :root {
    --bg0: #0b1020;
    --bg1: #0f1834;
    --bg2: #16213e;
    --accent: #4ecca3;
    --accent2: #ffd369;
    --muted: #93a4c9;
    --text: #eef2ff;
    --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; color: var(--text); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
  body { -webkit-font-smoothing: antialiased; }

  .slide {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(1200px 800px at 20% 10%, #1a2856 0%, transparent 60%),
                radial-gradient(1000px 700px at 90% 90%, #122046 0%, transparent 55%),
                linear-gradient(135deg, var(--bg0) 0%, var(--bg1) 100%);
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .slide + .slide { margin-top: 24px; }

  .eyebrow {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: .2em;
    font-size: 28px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  h1 { font-size: 110px; line-height: 1.05; margin: 0 0 32px; letter-spacing: -.01em; }
  h2 { font-size: 72px; line-height: 1.1; margin: 0 0 28px; }
  h3 { font-size: 44px; line-height: 1.2; margin: 0 0 18px; color: var(--accent2); }
  p, li { font-size: 36px; line-height: 1.55; color: var(--text); }
  .lead { font-size: 44px; color: var(--muted); line-height: 1.5; }

  .accent { color: var(--accent); }
  .yellow { color: var(--accent2); }
  .muted { color: var(--muted); }

  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 36px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }

  .card {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px;
  }
  .card .num {
    display: inline-block;
    background: var(--accent);
    color: #0b1020;
    width: 56px; height: 56px;
    border-radius: 14px;
    text-align: center;
    line-height: 56px;
    font-weight: 800;
    font-size: 28px;
    margin-bottom: 20px;
  }
  .card h3 { color: var(--accent2); font-size: 38px; margin-bottom: 14px; }
  .card p { font-size: 28px; color: var(--muted); }

  .footer {
    position: absolute; left: 120px; right: 120px; bottom: 56px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 24px;
    border-top: 1px solid var(--line); padding-top: 24px;
  }
  .footer .brand { color: var(--accent); font-weight: 800; letter-spacing: .08em; }

  /* Slide 1: Cover */
  .cover h1 { font-size: 168px; letter-spacing: -.02em; }
  .cover .tag {
    display: inline-block; padding: 12px 28px; border-radius: 999px;
    background: rgba(78,204,163,.15); color: var(--accent);
    border: 1px solid rgba(78,204,163,.4);
    font-weight: 700; font-size: 30px; margin-bottom: 36px;
  }
  .cover .sub { font-size: 52px; color: var(--text); margin-top: 16px; }
  .cover .by { font-size: 28px; color: var(--muted); margin-top: 64px; }

  /* Problem table */
  table.problem { width: 100%; border-collapse: collapse; font-size: 32px; margin-top: 12px; }
  table.problem th, table.problem td { text-align: left; padding: 22px 24px; border-bottom: 1px solid var(--line); }
  table.problem th { color: var(--accent); font-weight: 700; font-size: 30px; }
  table.problem td.q { color: var(--accent2); font-weight: 700; width: 26%; }

  /* Founder story */
  .story blockquote {
    border-left: 6px solid var(--accent);
    padding: 8px 0 8px 32px;
    margin: 0 0 24px 0;
    font-size: 34px;
    color: var(--text);
    line-height: 1.6;
  }
  .story .name { color: var(--muted); font-size: 26px; }

  /* Big stat */
  .stats { display: flex; gap: 48px; margin-top: 24px; }
  .stat { flex: 1; }
  .stat .v { font-size: 96px; color: var(--accent); font-weight: 800; line-height: 1; }
  .stat .l { font-size: 26px; color: var(--muted); margin-top: 14px; }

  /* compare table */
  table.compare { width: 100%; border-collapse: collapse; font-size: 28px; }
  table.compare th, table.compare td { padding: 22px 26px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.compare th { background: rgba(255,255,255,.05); color: var(--accent2); font-weight: 700; }
  table.compare td.label { color: var(--muted); width: 22%; }
  table.compare td.us { color: var(--accent); font-weight: 700; }

  /* roadmap */
  .roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .phase {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    border-radius: 20px; padding: 32px;
  }
  .phase .y { color: var(--accent); font-weight: 800; font-size: 28px; letter-spacing: .12em; }
  .phase h4 { font-size: 32px; margin: 10px 0 16px; color: var(--accent2); }
  .phase p { font-size: 24px; color: var(--muted); }

  /* CTA */
  .cta h1 { font-size: 140px; line-height: 1.05; }
  .cta .pill { display: inline-block; padding: 14px 32px; border-radius: 999px;
    background: var(--accent); color: #0b1020; font-weight: 800; font-size: 36px;
    margin-top: 24px;
  }
  .cta .who { font-size: 32px; color: var(--muted); margin-top: 56px; }

  /* Engine card big */
  .engines { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; margin-top: 16px; }
  .engine {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--line);
    border-radius: 24px; padding: 36px;
  }
  .engine .icn { font-size: 64px; margin-bottom: 10px; }
  .engine h3 { font-size: 36px; color: var(--accent); margin-bottom: 8px; }
  .engine .name { font-size: 22px; color: var(--muted); letter-spacing: .12em; margin-bottom: 18px; }
  .engine p { font-size: 26px; color: var(--text); line-height: 1.5; }

  /* dots */
  .dots { display: flex; gap: 12px; margin-bottom: 28px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dot.on { background: var(--accent); }

  /* highlight band */
  .band {
    background: linear-gradient(90deg, rgba(78,204,163,.18), rgba(78,204,163,0));
    border-left: 8px solid var(--accent);
    padding: 28px 36px; border-radius: 8px; margin-top: 28px;
  }
  .band p { font-size: 36px; color: var(--text); }
</style>

<style>html,body{background:#000;margin:0;padding:0}.slide{margin:0!important}</style>
</head><body><section class="slide story">
  <div class="eyebrow">FOUNDER'S STORY</div>
  <h2>「儲かる作物は何ですか？」<br><span class="muted">— 誰も答えられなかった。</span></h2>
  <blockquote>
    トマト農家に生まれ、椎茸・イチゴ・ネギ……何度も挑戦して、何度も失敗した。<br>
    青果市場に勤めて気づいた。<strong class="yellow">JAの職員も、市場のベテランも、答えを持っていない。</strong><br>
    「危険だからおすすめできない」「いつも通りの作物が一番」——そう流されて、農家は疲弊していく。
  </blockquote>
  <p class="lead">気候は変わる。市場も変わる。<br>なのに<span class="accent">「設備投資」と「過去の成功体験」</span>に縛られて、農家は作物を変えられない。</p>
  <div class="band"><p>だから僕は、<strong class="accent">「未来のデータで経営を決める」</strong>世界をつくる。</p></div>
  <div class="footer"><span class="brand">APE</span><span>03 / 12</span></div>
</section></body></html>
